<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- TrustLens Official Logo Symbol: Shield + Magnifying Glass + Verification Checkmark + Data Visualization -->
  <defs>
    <linearGradient id="tlShieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="tlTealGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield -->
  <path
    d="M24 4L7 10.5V22C7 32.5 14.3 42.1 24 44.5C33.7 42.1 41 32.5 41 22V10.5L24 4Z"
    fill="#0B1220"
    stroke="#14B8A6"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Shield Inner Glow -->
  <path
    d="M24 7.5L10 12.8V21.5C10 29.8 15.9 37.8 24 40.2C32.1 37.8 38 29.8 38 21.5V12.8L24 7.5Z"
    fill="#090F1A"
    opacity="0.85"
  />

  <!-- Evidence Analysis Data Visualization Bars (Left & Bottom) -->
  <rect x="14" y="24" width="3" height="7" rx="1.5" fill="#14B8A6" opacity="0.6" />
  <rect x="19" y="20" width="3" height="11" rx="1.5" fill="#14B8A6" opacity="0.8" />
  <rect x="24" y="17" width="3" height="14" rx="1.5" fill="#2DD4BF" />
  <rect x="29" y="22" width="3" height="9" rx="1.5" fill="#14B8A6" opacity="0.7" />

  <!-- Magnifying Glass Lens Ring (Investigation) -->
  <circle
    cx="23"
    cy="21"
    r="9.5"
    stroke="#14B8A6"
    stroke-width="2.75"
    fill="#0B1220"
    fill-opacity="0.6"
  />

  <!-- Verification Checkmark (Inside Lens) -->
  <path
    d="M18.5 21L21.5 24L28 17.5"
    stroke="#2DD4BF"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Magnifying Glass Handle -->
  <path
    d="M30 28L36 34"
    stroke="#14B8A6"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
